services:
  - type: web
    name: chainrestore
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chainrestore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
databases:
  - name: chainrestore-db
    databaseName: chainrestore
    user: chainrestore
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "18"
