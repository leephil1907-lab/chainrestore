<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member sign in — ChainRestore</title><link rel="stylesheet" href="/theme.css"><script src="/app.js" defer></script><style>body{min-height:100vh;display:grid;place-items:center;padding:22px}.login{width:min(440px,100%);padding:34px}.login input,.login button{width:100%;height:50px;margin-top:12px}.login input{background:#08131b;border:1px solid var(--line);border-radius:13px;padding:0 14px;color:var(--text)}.login button{border:0}.login .alt{background:transparent;color:var(--muted);border:1px solid var(--line)}.msg{min-height:22px;color:var(--muted);font-size:13px}</style></head><body><main class="login glass"><a class="brand" href="/"><span class="brand-mark">C</span>ChainRestore</a><div class="eyebrow" style="margin-top:28px">Secure member access</div><h1 id="heading">Welcome back.</h1><p id="sub" class="muted">Sign in with an email verification code. No password required.</p><form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="Email address" required><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden><button class="btn btn-primary" id="submit" type="submit">Send sign-in code</button><button class="btn alt" id="back" type="button" hidden>Use another email</button></form><div id="passkey" hidden><p class="muted">Add a passkey for faster sign-in with your device screen lock or biometrics.</p><button class="btn btn-primary" id="addkey" type="button">Add a passkey</button><button class="btn alt" id="skipkey" type="button">Not now</button></div><p class="msg" id="msg" role="status"></p><p class="muted" style="font-size:12px">Never share your verification code with anyone, including support agents.</p></main><script>
(()=>{const A=window.hatchable.auth,form=document.getElementById("form"),email=document.getElementById("email"),code=document.getElementById("code"),submit=document.getElementById("submit"),back=document.getElementById("back"),msg=document.getElementById("msg"),passkey=document.getElementById("passkey");let step="email",hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get("next")||"/account.html";return n.startsWith("/")&&!n.startsWith("//")&&!n.includes("\\")?n:"/account.html"};const done=()=>location.replace(next());A.getSession().then(s=>{if(s&&s.user)done()}).catch(()=>{});form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;msg.textContent="";try{if(step==="email"){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const p=await A.signInWithPasskey({email:email.value.trim()});if(p&&p.user){done();return}}catch(_){}}step="code";code.hidden=false;back.hidden=false;submit.textContent="Verify and sign in";msg.textContent="A one-time code has been sent to your email.";code.focus()}else{const r=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!r||!r.user)throw new Error("Verification failed.");if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem("chainrestore_passkey_skip")!=="1"){form.hidden=true;passkey.hidden=false;document.getElementById("heading").textContent="You're signed in";document.getElementById("sub").textContent="Make future sign-ins easier with a passkey."}else done()}}catch(err){msg.textContent=err.message||"Sign-in could not be completed. Try again."}finally{submit.disabled=false}});back.addEventListener("click",()=>{step="email";code.hidden=true;back.hidden=true;submit.textContent="Send sign-in code";msg.textContent=""});document.getElementById("addkey").addEventListener("click",async()=>{try{await A.registerPasskey();done()}catch(e){msg.textContent=e.message||"Passkey setup was not completed."}});document.getElementById("skipkey").addEventListener("click",()=>{localStorage.setItem("chainrestore_passkey_skip","1");done()})})();
</script></body></html>
